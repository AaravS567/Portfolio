<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aaron — Contact</title>
<style>
  :root{
    --paper:#F7F5F0; --ink:#1C2321; --line:#D8D3C8; --accent:#3E6259; --muted:#6B6A63;
    padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#15181A; --ink:#EDEAE2; --line:#33372F; --accent:#7FB5A6; --muted:#9A988E; }
  }
  :root[data-theme="dark"]{ --paper:#15181A; --ink:#EDEAE2; --line:#33372F; --accent:#7FB5A6; --muted:#9A988E; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; line-height:1.6;}
  .wrap{max-width:560px; margin:0 auto; padding:48px 24px 96px;}
  .topnav{display:flex; gap:22px; font-family:-apple-system,"Segoe UI",sans-serif; font-size:14px; margin-bottom:56px; flex-wrap:wrap;}
  .topnav a{color:var(--muted); text-decoration:none; padding-bottom:4px; border-bottom:2px solid transparent;}
  .topnav a.active{color:var(--ink); border-bottom-color:var(--accent);}
  .topnav a:hover{color:var(--ink);}
  h1{font-size:30px; margin:0 0 12px; font-weight:600;}
  p{margin:0 0 28px; max-width:56ch; color:var(--muted);}
  label{display:block; font-family:-apple-system,"Segoe UI",sans-serif; font-size:13px; color:var(--muted); margin:0 0 6px;}
  input, textarea{
    width:100%; font-family:-apple-system,"Segoe UI",sans-serif; font-size:15px; color:var(--ink);
    background:transparent; border:1px solid var(--line); border-radius:2px; padding:10px 12px; margin-bottom:20px;
  }
  textarea{min-height:120px; resize:vertical;}
  button{
    font-family:-apple-system,"Segoe UI",sans-serif; font-size:14px; background:var(--accent); color:var(--paper);
    border:none; padding:11px 22px; border-radius:2px; cursor:pointer;
  }
  button:hover{opacity:.9;}
  .alt{margin-top:28px; font-family:-apple-system,"Segoe UI",sans-serif; font-size:13px; color:var(--muted);}
  .alt a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="resume.html">Resume</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <h1>Get in touch</h1>
  <p>Have a question, an idea, or just want to talk about something I've built? Send a message below.</p>

  <!-- Replace YOUR_FORM_ID with the ID Formspree gives you after signup (free, no coding needed) -->
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Your email</label>
    <input type="email" id="email" name="_replyto" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Send message</button>
  </form>

  <div class="alt">
    Prefer email directly? Reach me at <a href="mailto:aaravsakhareliya@gmail.com">aaravsakhareliya@gmail.com</a>.
  </div>
</div>
</body>
</html>
