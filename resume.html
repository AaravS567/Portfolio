<style>
  :root{
    --paper:#F7F5F0; --ink:#1C2321; --line:#D8D3C8; --accent:#3E6259; --muted:#6B6A63;
    padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#15181A; --ink:#EDEAE2; --line:#33372F; --accent:#7FB5A6; --muted:#9A988E; }
  }
  :root[data-theme="dark"]{ --paper:#15181A; --ink:#EDEAE2; --line:#33372F; --accent:#7FB5A6; --muted:#9A988E; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; line-height:1.6;}
  .wrap{max-width:640px; margin:0 auto; padding:48px 24px 96px;}
  .topnav{display:flex; gap:22px; font-family:-apple-system,"Segoe UI",sans-serif; font-size:14px; margin-bottom:48px; flex-wrap:wrap;}
  .topnav a{color:var(--muted); text-decoration:none; padding-bottom:4px; border-bottom:2px solid transparent;}
  .topnav a.active{color:var(--ink); border-bottom-color:var(--accent);}
  .topnav a:hover{color:var(--ink);}
  .rhead{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
  h1{font-size:30px; margin:0; font-weight:600;}
  .print{font-family:-apple-system,"Segoe UI",sans-serif; font-size:13px; color:var(--accent); text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:2px;}
  .contactline{font-family:-apple-system,"Segoe UI",sans-serif; font-size:13px; color:var(--muted); margin-bottom:40px;}
  section{margin-top:36px; padding-top:28px; border-top:1px solid var(--line);}
  section:first-of-type{margin-top:0; padding-top:0; border-top:none;}
  section h2{font-family:-apple-system,"Segoe UI",sans-serif; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 16px;}
  .item{margin-bottom:18px;}
  .item:last-child{margin-bottom:0;}
  .item-head{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .item-title{font-weight:600;}
  .item-org{font-style:italic;}
  .item-meta{font-family:-apple-system,"Segoe UI",sans-serif; font-size:13px; color:var(--muted); white-space:nowrap;}
  p{margin:4px 0 0; max-width:60ch;}
  ul{margin:6px 0 0; padding-left:18px;}
  li{margin-bottom:2px;}
  .pills{display:flex; gap:8px; flex-wrap:wrap;}
  .pills span{font-family:-apple-system,"Segoe UI",sans-serif; font-size:12px; border:1px solid var(--line); padding:4px 10px; border-radius:2px; color:var(--muted);}
  @media print{ .topnav, .print{display:none;} }
</style>
